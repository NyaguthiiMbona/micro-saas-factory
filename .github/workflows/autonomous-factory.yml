name: Autonomous Micro-SaaS Factory Pipeline

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autonomous-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Project Files
        run: |
          echo "Checking repository files..."
          test -f package.json || {
            echo "ERROR: package.json not found in repository root."
            exit 1
          }
          echo "package.json found."
          if [ -f package-lock.json ]; then
            echo "package-lock.json found."
          else
            echo "WARNING: package-lock.json not found."
          fi

      - name: Install Dependencies
        run: npm install

      - name: Step 1 - Run Trend-Spotter Agent (Agent 1)
        run: node scripts/trend-spotter.js

      - name: Step 2 - Run Full-Stack Developer Agent (Agent 2)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-tool.js

      - name: Commit & Push Code Changes
        run: |
          git config user.name "Autonomous Factory Bot"
          git config user.email "factory-bot@micro-saas.internal"
          git add specs/ app/tools/ public/sitemap.xml || true

          if ! git diff --cached --quiet; then
            git commit -m "feat(factory): autonomous build and deploy pipeline execution"
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi

      - name: Step 3 - Run DevOps Publisher (Agent 3)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy-cloudflare.js

      - name: Step 4 - Run SEO Indexer (Agent 4)
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: node scripts/index-seo.js
