
name: Autonomous Micro-SaaS Factory Pipeline

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      generate_tool:
        description: 'Generate one tool specification using local templates'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Verify Required Scripts
        run: |
          test -f scripts/ai-generate-tool.js
          test -f scripts/research-tool-ideas.js

      - name: Generate Tool Specification
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate_tool) }}
        run: node scripts/ai-generate-tool.js

      - name: Run Research Scoring Engine
        run: node scripts/research-tool-ideas.js

      - name: Validate Research Report
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "specs/research/research-report.json";

            if (!fs.existsSync(file)) {
              throw new Error("Research report was not created.");
            }

            const report = JSON.parse(
              fs.readFileSync(file, "utf8")
            );

            if (!Array.isArray(report.candidates)) {
              throw new Error("Research candidates are missing.");
            }

            console.log("Research report is valid.");
            console.log("Candidates reviewed:", report.candidates.length);
            console.log("Status:", report.status);
          '

      - name: Save Research Report
        uses: actions/upload-artifact@v4
        with:
          name: tool-research-report
          path: specs/research/research-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Save Generated Specifications
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate_tool) }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-tool-specifications
          path: specs/generated/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit Research and Specifications
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate_tool) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add specs/generated/*.json
          git add specs/research/research-report.json

          if git diff --cached --quiet; then
            echo "No new files or changes to commit."
          else
            git commit -m "Update tool research report"
            git push
          fi

      - name: Verify Application Files
        run: |
          test -f app/layout.tsx
          test -f app/page.tsx
          test -f app/globals.css
          test -f components/ToolEngine.tsx
          test -f components/ToolLayout.tsx
          test -f components/AdSlot.tsx
          test -f scripts/deploy-cloudflare.js

      - name: Build Website
        run: npm run build

      - name: Verify Static Export
        run: |
          if [ ! -f out/index.html ]; then
            echo "ERROR: out/index.html was not created by the build."
            exit 1
          fi
          echo "Static export verified."

      - name: Diagnose Cloudflare Configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e '
            console.log("API token present:", Boolean(process.env.CLOUDFLARE_API_TOKEN));
            console.log("Account ID present:", Boolean(process.env.CLOUDFLARE_ACCOUNT_ID));
            console.log("Account ID length:", (process.env.CLOUDFLARE_ACCOUNT_ID || "").length);
          '

          echo "Checking deployment script:"
          grep -nE 'Starting Cloudflare|Initiating deployment|wrangler|CLOUDFLARE_ACCOUNT_ID' scripts/deploy-cloudflare.js

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-cloudflare.js
