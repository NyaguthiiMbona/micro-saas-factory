
name: Autonomous Micro-SaaS Factory Pipeline

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Verify Application Files
        run: |
          test -f app/layout.tsx
          test -f app/page.tsx
          test -f app/globals.css
          test -f components/ToolEngine.tsx
          test -f components/ToolLayout.tsx
          test -f components/AdSlot.tsx

      - name: Build Website
        run: npm run build

      - name: Verify Static Export
        run: test -f out/index.html

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-cloudflare.js
