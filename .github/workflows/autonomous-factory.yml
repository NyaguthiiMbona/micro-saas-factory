
name: Micro-SaaS Factory Build Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Verify Application Files
        run: |
          test -f app/layout.tsx
          test -f app/page.tsx
          test -f app/globals.css
          test -f components/ToolEngine.tsx
          test -f components/ToolLayout.tsx
          test -f components/AdSlot.tsx

      - name: Build Website
        run: npm run build
