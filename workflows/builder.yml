name: Agent 2 - Full-Stack Builder Pipeline

on:
  push:
    paths:
      - 'specs/*.md'

jobs:
  build-tool:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Developer Agent Generation Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node scripts/generate-tool.js

      - name: Commit Generated Tool Code
        run: |
          git config --global user.name "Agent 2 [Builder]"
          git config --global user.email "builder-agent@micro-saas.internal"
          git add app/tools/
          git commit -m "feat(builder): auto-generate utility from latest trend spec"
          git push origin main
