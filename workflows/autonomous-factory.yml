name: Autonomous Micro-SaaS Factory Pipeline

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 06:00 UTC
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  autonomous-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Step 1 - Run Trend-Spotter Agent (Agent 1)
        env:
          REDDIT_API_KEY: ${{ secrets.REDDIT_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          node scripts/trend-spotter.js

      - name: Step 2 - Run Full-Stack Developer Agent (Agent 2)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node scripts/generate-tool.js

      - name: Commit & Push Code Changes
        run: |
          git config --global user.name "Autonomous Factory Bot"
          git config --global user.email "factory-bot@micro-saas.internal"
          git add specs/ app/tools/ public/sitemap.xml
          git commit -m "feat(factory): autonomous build and deploy pipeline execution"
          git push origin main

      - name: Step 3 - Run DevOps Publisher (Agent 3)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/deploy-cloudflare.js

      - name: Step 4 - Run SEO Indexer (Agent 4)
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          node scripts/index-seo.js
